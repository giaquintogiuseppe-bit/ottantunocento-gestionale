<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Aggiorna app — Ottantunocento S.r.l.</title>
<style>
  :root{ --navy:#152238; --navy2:#1e3350; --teal:#0e6b64; --gold:#c69a3e; --ink:#152238; --ink2:#5a6272; --ok:#0e6b64; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:linear-gradient(135deg,var(--navy),var(--navy2));
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .box{ background:#fff; border-radius:16px; padding:28px 24px; width:100%; max-width:360px;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .ey{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  h2{ margin:6px 0 2px; color:var(--ink); font-size:20px; }
  .sub{ color:var(--ink2); font-size:13px; margin:10px 0 4px; line-height:1.45; min-height:20px; }
  .sub.ok{ color:var(--ok); font-weight:600; }
  .spin{ width:26px; height:26px; margin:12px auto 4px; border:3px solid #dfe3ea; border-top-color:var(--teal); border-radius:50%; animation:sp 0.8s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  a.btn{ display:inline-block; margin-top:14px; padding:12px 18px; border-radius:9px; background:var(--teal); color:#fff;
    font-size:15px; font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <div class="ey">Ottantunocento S.r.l.</div>
  <h2>Aggiornamento app</h2>
  <div class="spin" id="spin"></div>
  <div class="sub" id="msg">Pulizia della cache in corso…</div>
  <div id="fallback"></div>
</div>
<script>
(function(){
  'use strict';
  var msg=document.getElementById('msg');
  var spin=document.getElementById('spin');
  function done(){
    spin.style.display='none';
    msg.className='sub ok';
    msg.textContent='Fatto ✓ Riapro la app aggiornata…';
    var dest='./index.html?v='+Date.now();
    document.getElementById('fallback').innerHTML='<a class="btn" href="'+dest+'">Apri la app</a>';
    setTimeout(function(){ location.replace(dest); }, 1200);
  }
  async function pulisci(){
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        for(var i=0;i<regs.length;i++){ try{ await regs[i].unregister(); }catch(e){} }
      }
      if(window.caches && caches.keys){
        var keys=await caches.keys();
        for(var j=0;j<keys.length;j++){ try{ await caches.delete(keys[j]); }catch(e){} }
      }
    }catch(e){ /* proseguo comunque */ }
    done();
  }
  pulisci();
})();
</script>
</body>
</html>
